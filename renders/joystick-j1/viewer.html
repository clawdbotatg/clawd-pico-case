<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J1 joystick fit test</title>
<style>
:root{
  --bg:#ecebe6; --panel:#f7f6f2; --ink:#1d1f22; --muted:#6b6f75; --line:#d6d3cb;
  --accent:#c2601e; --grid:#c9c6bd; --chip:#e4e1d9;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#181a1d; --panel:#20232a; --ink:#e9e7e1; --muted:#9a9ea6; --line:#343841;
  --accent:#e0803a; --grid:#2c3037; --chip:#2b2f37;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#181a1d; --panel:#20232a; --ink:#e9e7e1; --muted:#9a9ea6; --line:#343841;
  --accent:#e0803a; --grid:#2c3037; --chip:#2b2f37;}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.01em}
header .dims{font-family:var(--mono);color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
main{flex:1;display:grid;grid-template-columns:1fr 260px;min-height:0}
#stage{position:relative;min-height:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
aside{border-left:1px solid var(--line);background:var(--panel);padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.parts{display:flex;flex-direction:column;gap:6px}
.part{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 6px;border-radius:6px}
.part:hover{background:var(--chip)}
.part input{margin:0;accent-color:var(--accent)}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.15);flex:none}
.part .n{flex:1}
.part .s{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
label.range{display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:inherit;font-size:12.5px;padding:7px 8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted)}
.note ul{margin:6px 0 0;padding-left:16px}
.note li{margin:2px 0}
.hint{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none}
.stamp{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none}
@media (max-width:720px){main{grid-template-columns:1fr;grid-template-rows:60vh auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<header>
  <h1>J1 joystick · REVIEW BEFORE PRINT</h1>
  <span class="dims" id="dims"></span>
</header>
<main>
  <div id="stage"><canvas id="c"></canvas><div class="hint">drag: turn · shift-drag / two fingers: pan · wheel / pinch: zoom</div><div class="stamp" id="stamp"></div></div>
  <aside>
    <section><h2>Parts</h2><div class="parts" id="parts"></div></section>
    <section><label class="range"><h2>Explode</h2><input type="range" id="explode" min="0" max="30" value="0" step="0.5"></label></section>
    <section><h2>View</h2><div class="views">
      <button data-v="iso">Iso</button><button data-v="top">Screen</button><button data-v="bottom">Back</button>
      <button data-v="front">Buttons</button><button data-v="side">Side</button><button data-v="usb">USB end</button>
    </div></section>
    <section><label class="range">Shell transparency<input type="range" id="opacity" min="0.15" max="1" value="1" step="0.05"></label></section>
    <section class="note"><h2>Assumptions in this build</h2><ul id="assume"></ul></section>
  </aside>
</main>

function parseSTL(b64){
  const bin=atob(b64), n=bin.length, buf=new ArrayBuffer(n), u8=new Uint8Array(buf);
  for(let i=0;i<n;i++)u8[i]=bin.charCodeAt(i);
  const dv=new DataView(buf), tris=dv.getUint32(80,true);
  const pos=new Float32Array(tris*9), nor=new Float32Array(tris*9);
  let o=84;
  for(let t=0;t<tris;t++){
    const nx=dv.getFloat32(o,true),ny=dv.getFloat32(o+4,true),nz=dv.getFloat32(o+8,true);o+=12;
    for(let v=0;v<3;v++){const k=t*9+v*3;pos[k]=dv.getFloat32(o,true);pos[k+1]=dv.getFloat32(o+4,true);pos[k+2]=dv.getFloat32(o+8,true);nor[k]=nx;nor[k+1]=ny;nor[k+2]=nz;o+=12;}
    o+=2;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  return g;
}

grid.material.opacity=0.12;grid.material.transparent=true;grid.position.y=zmin-1;scene.add(grid);
function setGridColor(){const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light'||document.documentElement.dataset.theme==='dark';grid.material.color.set(dark?0xffffff:0x000000);}
setGridColor();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{setGridColor();draw();});

$('#explode').addEventListener('input',e=>{const d=+e.target.value;for(const n in meshes)meshes[n].position.z=(EXPLODE[n]||0)*d;draw();});
$('#opacity').addEventListener('input',e=>{for(const n of ['lid']){meshes[n].material.opacity=+e.target.value;meshes[n].material.depthWrite=+e.target.value===1;}draw();});

// orbit: spherical camera about a target
const target=new THREE.Vector3(0,(zmin+Math.max(...PARTS.map(p=>p.bbox[5])))/2,0);
let theta=0.6, phi=1.05, dist=70;
function place(){camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);}
const VIEWS={iso:[0.6,1.05],top:[0,0.001],bottom:[0,Math.PI-0.001],front:[Math.PI,Math.PI/2],side:[Math.PI/2,Math.PI/2],usb:[0,Math.PI/2]};
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>{[theta,phi]=VIEWS[b.dataset.v];place();draw();}));
let drag=null;
function pt(e){return e.touches?[...e.touches].map(t=>[t.clientX,t.clientY]):[[e.clientX,e.clientY]];}
function down(e){drag={pts:pt(e),shift:e.shiftKey};e.preventDefault();}
function move(e){
  if(!drag)return;const p=pt(e);
  if(p.length===2&&drag.pts.length===2){
    const d0=Math.hypot(drag.pts[0][0]-drag.pts[1][0],drag.pts[0][1]-drag.pts[1][1]),d1=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    dist=Math.max(30,Math.min(600,dist*d0/d1));
    pan((p[0][0]+p[1][0]-drag.pts[0][0]-drag.pts[1][0])/2,(p[0][1]+p[1][1]-drag.pts[0][1]-drag.pts[1][1])/2);
  }else if(drag.shift){pan(p[0][0]-drag.pts[0][0],p[0][1]-drag.pts[0][1]);}
  else{theta-=(p[0][0]-drag.pts[0][0])*0.008;phi=Math.max(0.001,Math.min(Math.PI-0.001,phi-(p[0][1]-drag.pts[0][1])*0.008));}
  drag.pts=p;place();draw();e.preventDefault();
}
function pan(dx,dy){const s=dist*0.0016;const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);target.addScaledVector(right,-dx*s).addScaledVector(up,dy*s);}
stage.addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',()=>drag=null);
stage.addEventListener('touchstart',down,{passive:false});stage.addEventListener('touchmove',move,{passive:false});stage.addEventListener('touchend',()=>drag=null);
stage.addEventListener('wheel',e=>{dist=Math.max(30,Math.min(600,dist*Math.exp(e.deltaY*0.0015)));place();draw();e.preventDefault();},{passive:false});

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function draw(){renderer.render(scene,camera);}
new ResizeObserver(()=>{resize();draw();}).observe(stage);
resize();place();draw();
</script>
